# Comprueba en cada push y pull request que el proyecto compila y los tests pasan.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (ESLint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend (tests de la API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # Misma base de datos que en local (MariaDB 10.4 de XAMPP)
      db:
        image: mariadb:10.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: al_son_del_huila_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: curl, fileinfo, mbstring, openssl, pdo_mysql, zip, intl
          coverage: none

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar .env
        run: |
          cp .env.example .env
          php artisan key:generate

      # El runner trae el cliente `mysql`, que Laravel usa para cargar database/schema/mysql-schema.sql
      - name: Tests
        run: php artisan test
